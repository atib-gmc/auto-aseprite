name: Auto Build Aseprite Windows x64

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Aseprite for Windows
    runs-on: windows-2022

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3️⃣ Install Python dependencies
      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Download dependencies (Skia)
      - name: Download Aseprite dependencies
        run: python download.py

      # 5️⃣ Setup Ninja
      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@v1.1

      # 6️⃣ Setup MSVC
      - name: Setup MSVC Dev Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64

      # 7️⃣ Install OpenSSL via Chocolatey
      - name: Install OpenSSL
        run: choco install openssl -y

      # 8️⃣ Build Aseprite
      - name: Build Aseprite
        shell: pwsh
        run: |
          mkdir build
          cd build
          
          cmake "${{ github.workspace }}/src/aseprite" `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=MinSizeRel `
            -DLAF_BACKEND=skia `
            -DSKIA_DIR="${{ github.workspace }}/src/skia" `
            -DSKIA_LIBRARY_DIR="${{ github.workspace }}/src/skia/out/Release-x64" `
            -DSKIA_LIBRARY="${{ github.workspace }}/src/skia/out/Release-x64/skia.lib"

          cmake --build . --config MinSizeRel --target aseprite

          # 9️⃣ Copy OpenSSL DLLs
          $libcrypto = Get-ChildItem "C:\ProgramData\chocolatey\lib\openssl*" -Recurse -Filter "libcrypto*.dll" | Select-Object -First 1
          $libssl = Get-ChildItem "C:\ProgramData\chocolatey\lib\openssl*" -Recurse -Filter "libssl*.dll" | Select-Object -First 1

          if ($libcrypto) { copy $libcrypto.FullName ".\bin" } else { Write-Host "libcrypto not found!" }
          if ($libssl) { copy $libssl.FullName ".\bin" } else { Write-Host "libssl not found!" }

      # 10️⃣ Get version
      - name: Get version
        id: get_version
        run: |
          $version = Get-Content version.txt
          echo "version=$version" >> $env:GITHUB_OUTPUT

      # 11️⃣ Zip Aseprite
      - name: Zip Aseprite
        run: |
          cd build/bin
          7z a ../../Aseprite-Windows-x64-${{ steps.get_version.outputs.version }}.zip *

      # 12️⃣ Upload artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-x64-${{ steps.get_version.outputs.version }}
          path: Aseprite-Windows-x64-${{ steps.get_version.outputs.version }}.zip
